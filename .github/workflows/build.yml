name: Build test

# End-to-end check of pen-pal/centralized-workflow build.yml at the pinned ref.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: pen-pal/centralized-workflow/.github/workflows/build.yml@v1
    with:
      sha: ${{ github.sha }}
      repo_name: ${{ github.event.repository.name }}
      docker_targets: '["final","debug"]'
      build_args: |
        GREETING=hello

  check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SHA: ${{ github.sha }}
      DURATION: ${{ needs.build.outputs.build_duration }}
      IDENTITY: https://github.com/pen-pal/centralized-workflow/.github/workflows/build.yml@refs/tags/v1
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Duration output reaches the caller
        run: |
          echo "build_duration=$DURATION"
          [[ "$DURATION" =~ ^[0-9]+$ ]]

      - name: Both targets are multi-arch, signed, and built with args + secret
        run: |
          set -euo pipefail
          for tag in "$SHA" "$SHA-debug"; do
            ref="$IMAGE:$tag"
            platforms=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
              | jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(",")')
            echo "$ref -> $platforms"
            [ "$platforms" = "linux/amd64,linux/arm64" ]

            cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$ref" > /dev/null
            echo "$ref signature OK"

            out=$(docker run --rm --platform linux/amd64 "$ref")
            echo "$ref says: $out"
            [ "$out" = "hello from ${GITHUB_REPOSITORY_OWNER} on amd64" ]
          done
