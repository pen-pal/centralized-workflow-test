name: E2E test

# End-to-end check of pen-pal/centralized-workflow build, scan and deploy at the pinned ref.
# Deploy dispatches back to this repo; receive-dispatch.yml asserts the payload.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: pen-pal/centralized-workflow/.github/workflows/build.yml@v1
    with:
      sha: ${{ github.sha }}
      repo_name: ${{ github.event.repository.name }}
      docker_targets: '["final","debug"]'
      build_args: |
        GREETING=hello

  scan:
    needs: build
    permissions:
      packages: read
      pull-requests: write
    uses: pen-pal/centralized-workflow/.github/workflows/container-scan.yml@v1
    with:
      sha: ${{ github.sha }}
      repo_name: ${{ github.event.repository.name }}

  deploy:
    needs: scan
    permissions:
      contents: write # repository_dispatch back to this repo
    uses: pen-pal/centralized-workflow/.github/workflows/deploy.yml@v1
    with:
      sha: ${{ github.sha }}
      branch_slug: ${{ github.ref_name }}
      repo_name: ${{ github.event.repository.name }}
      app_name: e2e-app
    secrets:
      # GITHUB_TOKEN dispatches still start workflows, so no PAT is needed here.
      DISPATCH_PAT: ${{ github.token }}
      DEPLOY_REPO: ${{ github.event.repository.name }}

  check:
    needs: [build, scan, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SHA: ${{ github.sha }}
      DURATION: ${{ needs.build.outputs.build_duration }}
      SCAN_DURATIONS: ${{ needs.scan.outputs.anchore_scan_duration }} ${{ needs.scan.outputs.anchore_sbom_scan_duration }} ${{ needs.scan.outputs.trivy_scan_duration }}
      DEPLOY_DURATION: ${{ needs.deploy.outputs.deploy_duration }}
      IDENTITY: https://github.com/pen-pal/centralized-workflow/.github/workflows/build.yml@refs/tags/v1
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Duration outputs reach the caller
        run: |
          echo "build=$DURATION scan(anchore sbom trivy)=$SCAN_DURATIONS deploy=$DEPLOY_DURATION"
          for d in $DURATION $SCAN_DURATIONS $DEPLOY_DURATION; do [[ "$d" =~ ^[0-9]+$ ]]; done
          [ "$(wc -w <<< "$DURATION $SCAN_DURATIONS $DEPLOY_DURATION")" -eq 5 ]

      - name: Both targets are multi-arch, signed, and built with args + secret
        run: |
          set -euo pipefail
          for tag in "$SHA" "$SHA-debug"; do
            ref="$IMAGE:$tag"
            platforms=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
              | jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(",")')
            echo "$ref -> $platforms"
            [ "$platforms" = "linux/amd64,linux/arm64" ]

            cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$ref" > /dev/null
            echo "$ref signature OK"

            out=$(docker run --rm --platform linux/amd64 "$ref")
            echo "$ref says: $out"
            [ "$out" = "hello from ${GITHUB_REPOSITORY_OWNER} on amd64" ]
          done
