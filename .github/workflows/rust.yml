name: Rust checks

# Real-runner check of pen-pal/centralized-workflow test, precommit and audit at @main.

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 6 * * 1' # weekly: catch toolchain, runner image and upstream action changes
  workflow_dispatch:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    uses: pen-pal/centralized-workflow/.github/workflows/test.yml@main

  precommit:
    permissions:
      contents: read
    uses: pen-pal/centralized-workflow/.github/workflows/precommit.yml@main

  audit:
    permissions:
      contents: read
      checks: write
      issues: write
    uses: pen-pal/centralized-workflow/.github/workflows/audit.yml@main

  check:
    needs: precommit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Duration output reaches the caller
        env:
          DURATION: ${{ needs.precommit.outputs.precommit_duration }}
        run: |
          echo "precommit_duration=$DURATION"
          [[ "$DURATION" =~ ^[0-9]+$ ]]
