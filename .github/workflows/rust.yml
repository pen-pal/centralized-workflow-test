name: Rust checks

# Real-runner check of pen-pal/centralized-workflow test, precommit and audit at @main.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '47 6 * * 1' # weekly: catch toolchain, runner image and upstream action changes
  workflow_dispatch:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    uses: pen-pal/centralized-workflow/.github/workflows/test.yml@main
    with:
      clippy_all_targets: true

  precommit:
    permissions:
      contents: read
    uses: pen-pal/centralized-workflow/.github/workflows/precommit.yml@main

  audit:
    permissions:
      contents: read
      checks: write
      issues: write
    uses: pen-pal/centralized-workflow/.github/workflows/audit.yml@main

  coverage:
    permissions:
      contents: read
    uses: pen-pal/centralized-workflow/.github/workflows/coverage.yml@main
    with:
      min_coverage: 80

  check:
    needs: [precommit, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Duration output reaches the caller
        env:
          DURATION: ${{ needs.precommit.outputs.precommit_duration }}
          COVERAGE: ${{ needs.coverage.outputs.line_coverage }}
        run: |
          echo "precommit_duration=$DURATION line_coverage=$COVERAGE"
          [[ "$DURATION" =~ ^[0-9]+$ ]]
          [[ "$COVERAGE" =~ ^[0-9]+(\.[0-9]+)?$ ]]
