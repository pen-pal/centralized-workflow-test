name: PR

# Pull-request checks from centralized-workflow at @main, and cache cleanup on close.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, closed]

permissions: {}

jobs:
  title:
    if: github.event.action != 'closed'
    permissions:
      pull-requests: read
    uses: pen-pal/centralized-workflow/.github/workflows/pr-title.yml@main

  dependencies:
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: write
    uses: pen-pal/centralized-workflow/.github/workflows/dep-review.yml@main
    with:
      deny_licenses: GPL-3.0-only, AGPL-3.0-only

  cleanup:
    if: github.event.action == 'closed'
    permissions:
      actions: write
    uses: pen-pal/centralized-workflow/.github/workflows/cleanup.yml@main
